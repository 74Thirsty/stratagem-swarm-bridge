[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratagem-swarm-bridge"
version = "0.1.0"
description = "A local-first terminal communications desk for a single Grok-powered AI mediator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.80,<2",
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.6,<1"]

[project.scripts]
swarmbridge = "swarmbridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
